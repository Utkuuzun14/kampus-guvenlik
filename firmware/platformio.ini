; Kampüs Güvenlik Sistemi — ESP32-S2 sensör düğümü (Wemos LOLIN S2 Mini)
; Derleme:  pio run
; Yükleme:  pio run -t upload --upload-port COMx
; İzleme:   pio device monitor
; Ayrıntı: firmware/README.md

[env:lolin_s2_mini]
platform = espressif32@6.9.0
board = lolin_s2_mini
framework = arduino
monitor_speed = 115200

; S2'de ayrı USB-seri çip yok: seri çıktı yerel USB CDC üzerinden gelir.
; ARDUINO_USB_MODE=0 → TinyUSB (S2'nin tek USB modu), CDC_ON_BOOT=1 → Serial = USB CDC.
; (lolin_s2_mini kart tanımı da bunları verir; burada açıkça sabitlendi.)
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1

; Sürümler sabit: aynı kod her makinede aynı derlensin.
; PubSubClient QoS 1 yayınlayamadığı için 256dpi/MQTT (lwmqtt) kullanılıyor.
lib_deps =
    256dpi/MQTT@2.5.2
    bblanchon/ArduinoJson@7.2.1

; İlk hatada dur: gizli.h yoksa yalnızca anlaşılır #error mesajı görünsün.
build_src_flags =
    -Wfatal-errors
