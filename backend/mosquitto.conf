# ============================================================
# Mosquitto yapılandırması — IoT Kampüs Güvenlik Sistemi
# ============================================================
# Bu dosyayı C:\Program Files\mosquitto\mosquitto.conf olarak kaydet
# (veya var olan mosquitto.conf'un içeriğini bununla değiştir).

# --- Dinleme ayarı ---
# Broker 1883 portunda, tüm ağ arayüzlerinde dinler.
# 0.0.0.0 = hem localhost hem de yerel ağdaki ESP32-S2 bağlanabilsin.
listener 1883 0.0.0.0

# --- Kimlik doğrulama ---
# Anonim (parolasız) erişim KAPALI. Sözleşme gereği.
allow_anonymous false

# Parola dosyasının yolu. mosquitto_passwd ile oluşturduğun 'passwd' dosyası.
# Windows yolu ters bölü (\) ile yazılır.
password_file C:\Program Files\mosquitto\passwd

# --- Kalıcılık (persistence) ---
# Broker yeniden başlarsa QoS 1 mesajlarını kaybetmesin diye disk'e yazar.
persistence true
persistence_location C:\Program Files\mosquitto\

# --- Log ayarı ---
# Ne olup bittiğini görmek için log dosyası. Hata ayıklarken çok işe yarar.
log_dest file C:\Program Files\mosquitto\mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# --- Not: TLS (şifreli bağlantı) ilerideki adımda eklenecek ---
# Sistem çalışır hale gelince rapor 2.6 ile uyumlu olması için
# 8883 portunda TLS listener ekleyeceğiz.
